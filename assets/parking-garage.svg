<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Parking garage illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101113"/>
      <stop offset="55%" stop-color="#17181b"/>
      <stop offset="100%" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2d31"/>
      <stop offset="100%" stop-color="#0c0d0f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202226"/>
      <stop offset="100%" stop-color="#111214"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d9dee8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2125"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#caa51e"/>
      <stop offset="50%" stop-color="#111"/>
      <stop offset="100%" stop-color="#caa51e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#ceiling)"/>
  <rect y="320" width="1200" height="580" fill="url(#floor)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <g opacity="0.9">
    <rect x="40" y="82" width="160" height="10" rx="5" fill="url(#light)"/>
    <rect x="260" y="112" width="180" height="10" rx="5" fill="url(#light)"/>
    <rect x="510" y="90" width="170" height="10" rx="5" fill="url(#light)"/>
    <rect x="760" y="118" width="190" height="10" rx="5" fill="url(#light)"/>
    <rect x="1020" y="96" width="140" height="10" rx="5" fill="url(#light)"/>
    <rect x="110" y="252" width="165" height="10" rx="5" fill="url(#light)"/>
    <rect x="360" y="274" width="175" height="10" rx="5" fill="url(#light)"/>
    <rect x="620" y="244" width="180" height="10" rx="5" fill="url(#light)"/>
    <rect x="900" y="264" width="155" height="10" rx="5" fill="url(#light)"/>
  </g>

  <g opacity="0.18" filter="url(#blur)">
    <ellipse cx="290" cy="710" rx="260" ry="60" fill="#000"/>
    <ellipse cx="770" cy="706" rx="330" ry="72" fill="#000"/>
  </g>

  <g opacity="0.36">
