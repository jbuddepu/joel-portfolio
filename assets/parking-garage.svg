      <circle cx="52" cy="184" r="20" fill="#0a0b0d"/>
      <circle cx="196" cy="184" r="20" fill="#0a0b0d"/>
      <circle cx="52" cy="184" r="8" fill="#4a4f57"/>
      <circle cx="196" cy="184" r="8" fill="#4a4f57"/>
    </g>
    <g transform="translate(120 0)">
