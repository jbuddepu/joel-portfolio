  <g opacity="0.14">
    <path d="M0 860 H1200" stroke="#ffffff" stroke-width="3"/>
    <path d="M120 820 C330 770, 620 770, 1080 820" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
</svg>
