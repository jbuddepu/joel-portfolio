      <rect x="166" y="130" width="52" height="26" rx="8" fill="#d4d6d8"/>
      <rect x="42" y="164" width="42" height="10" rx="5" fill="#3c4045"/>
      <rect x="110" y="164" width="42" height="10" rx="5" fill="#3c4045"/>
      <rect x="178" y="164" width="42" height="10" rx="5" fill="#3c4045"/>
      <circle cx="56" cy="210" r="18" fill="#090a0c"/>
      <circle cx="198" cy="210" r="18" fill="#090a0c"/>
    </g>
  </g>

  <g transform="translate(500 610)">
    <path d="M20 112 L72 20 H346 L392 112 Z" fill="#e9ecef"/>
    <rect x="0" y="112" width="412" height="112" rx="22" fill="#f5f7f8"/>
    <path d="M52 62 H355 L376 112 H30 Z" fill="#d8dde1"/>
    <rect x="52" y="132" width="60" height="24" rx="8" fill="#7f8a94"/>
    <rect x="138" y="132" width="60" height="24" rx="8" fill="#7f8a94"/>
