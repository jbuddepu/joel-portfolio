    <rect x="18" y="0" width="34" height="680" fill="url(#stripe)"/>
    <rect x="62" y="0" width="34" height="680" fill="url(#stripe)"/>
    <rect x="106" y="0" width="34" height="680" fill="url(#stripe)"/>
